name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-js:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  test-rust:
    name: Rust Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Launches the real app and drives it over the WebView2 devtools protocol:
  # opens the settings window from the widget's button and asserts the app
  # stays responsive. Windows-only — it's the platform where webview creation
  # can deadlock the event loop (wry#583), and the one least often tested by
  # hand during development.
  test-e2e:
    name: E2E Smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run tauri build -- --debug --no-bundle --config src-tauri/tauri.e2e.conf.json

      # Guard for runner images that ship without the WebView2 Runtime: test
      # for the actual binaries (the EdgeUpdate registry entry can outlive
      # them, and the bootstrapper no-ops while it says "installed"). The
      # elevated-session DevTools regression in WebView2 150+ is handled in
      # the harness itself (see settings-window.e2e.mjs).
      - name: Install WebView2 Runtime if missing
        run: |
          $glob = 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe'
          $exe = Get-ChildItem $glob -ErrorAction SilentlyContinue
          if ($exe) { Write-Host "WebView2 Runtime present: $($exe.Directory.Name)"; exit 0 }
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { Write-Host 'clearing stale runtime registration'; Remove-Item $key -Recurse -Force }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          Start-Process "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent','/install' -Wait
          $exe = Get-ChildItem $glob -ErrorAction SilentlyContinue
          if (-not $exe) {
            Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView' -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw 'WebView2 Runtime installation failed'
          }
          Write-Host "WebView2 Runtime installed: $($exe.Directory.Name)"

      - run: npm run test:e2e
